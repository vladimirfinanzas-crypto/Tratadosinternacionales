<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tratados de Libre Comercio de México</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#dfe9ee;--fg:#10231a;--mut:#56695f;--glass:#ffffffd9;--line:#10231a26;--dot:#8fa89b;--acc:#00875a;--hot:#d71f3b;--s1:#f4fbff;--s2:#b9d3e0;--glow:#4aa3c8;--stage:radial-gradient(ellipse at 50% 45%,#fff,#c9d9e2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050b0f;--fg:#e8f4ee;--mut:#8fa99d;--glass:#0e1b22e6;--line:#ffffff24;--dot:#35695a;--acc:#2be39a;--hot:#ff5470;--s1:#123342;--s2:#07141c;--glow:#2bb7e3;--stage:radial-gradient(ellipse at 50% 45%,#0d2a36,#03080b 78%)}}
:root[data-theme="dark"]{--bg:#050b0f;--fg:#e8f4ee;--mut:#8fa99d;--glass:#0e1b22e6;--line:#ffffff24;--dot:#35695a;--acc:#2be39a;--hot:#ff5470;--s1:#123342;--s2:#07141c;--glow:#2bb7e3;--stage:radial-gradient(ellipse at 50% 45%,#0d2a36,#03080b 78%)}
html,body{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#st{position:relative;height:100%;background:var(--stage);overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.glass{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--line)}
.hud{position:absolute;left:16px;top:14px;z-index:5;pointer-events:none}
.hud h1{margin:0 0 8px;font-size:clamp(.95rem,2vw,1.3rem);animation:fade .8s both}
.by{margin:-3px 0 9px;font-size:.78rem;color:var(--mut);letter-spacing:.3px;animation:fade .8s .2s both}.by b{color:var(--acc);font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border-radius:9px;padding:3px 9px;font-size:.68rem;color:var(--mut);animation:fade .8s 1s both}
.chip b{color:var(--acc);font-size:.9rem;margin-right:4px}
@keyframes fade{from{opacity:0;transform:translateY(-8px)}}
#all{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:6;border-radius:99px;padding:9px 20px;font-size:.85rem;font-weight:700;color:var(--fg);cursor:pointer;transition:.25s;animation:fade .8s .3s both}
#all:hover{background:var(--acc);color:#04130c;transform:translateX(-50%) scale(1.06)}
.hint{position:absolute;right:16px;top:20px;z-index:5;font-size:.72rem;color:var(--mut);pointer-events:none;text-align:right}
#tl{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:6;display:flex;max-width:96%;overflow-x:auto;padding:6px 12px 4px;border-radius:99px;scrollbar-width:none;animation:fade .8s 1.4s both}
#tl::before{content:"";position:absolute;left:24px;right:24px;top:15px;height:1px;background:var(--line)}
#tl button{position:relative;flex:none;border:0;background:none;color:var(--mut);font-size:.66rem;padding:0 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.2s}
#tl button i{width:7px;height:7px;border-radius:50%;background:var(--mut);transition:.25s;margin-top:5px}
#tl button:hover{color:var(--fg)}#tl button:hover i{transform:scale(1.7);background:var(--hot)}
#tl button.on{color:var(--fg);font-weight:700}#tl button.on i{transform:scale(2);background:var(--hot);box-shadow:0 0 10px var(--hot)}
#bn{position:absolute;z-index:8;width:min(680px,calc(100% - 20px));max-height:min(90vh,680px);overflow:auto;border-radius:18px;box-shadow:0 20px 50px #0007;opacity:0;pointer-events:none;transform:scale(.9) translateY(10px);transform-origin:left center;transition:opacity .3s,transform .3s}
#bn.open{opacity:1;pointer-events:auto;transform:none}
.im{position:relative;height:118px;overflow:hidden;display:grid;place-items:center}
.im .ic{font-size:60px;animation:fl 3s ease-in-out infinite;filter:drop-shadow(0 8px 10px #0005)}
.im .bg{position:absolute;inset:0;font-size:34px;opacity:.13;line-height:1.6;letter-spacing:14px;word-break:break-all;transform:rotate(-8deg) scale(1.3)}
.im .fg{position:absolute;left:12px;top:8px;display:flex;align-items:center;gap:4px;background:#0005;border-radius:99px;padding:4px 9px}.fg img,.fr img{height:15px;border-radius:2px;box-shadow:0 0 0 1px #0005}.fg b{font-size:11px;color:#fff}.fr{margin-top:5px;display:flex;gap:3px;align-items:center}.fch{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}.fc{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:99px;padding:2px 9px 2px 3px;font-size:.72rem}.fc img{width:18px;height:18px;object-fit:cover;border-radius:50%}.fc.me{border-color:var(--acc);background:#34f0a41a}
.im svg{position:absolute;bottom:-1px;left:0;width:100%}
@keyframes fl{50%{transform:translateY(-7px) rotate(4deg)}}
.bd{padding:14px 16px 16px}
.bd h2{margin:0 0 4px;font-size:1.05rem}.bd p{margin:4px 0 8px;font-size:.82rem;color:var(--mut)}
.k{font-size:.62rem;text-transform:uppercase;letter-spacing:.8px;color:var(--acc);font-weight:700;margin-top:9px}
.v{font-size:.82rem}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.tags span{border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:.7rem}
.imp{display:grid;gap:6px;margin-top:5px}.imp div{font-size:.8rem;color:var(--mut);padding:7px 10px;border-radius:9px;border:1px solid var(--line)}.imp b{display:flex;align-items:center;gap:5px;color:var(--fg);font-size:.76rem;margin-bottom:2px}.imp img{height:12px;border-radius:2px}.bd p{margin:2px 0 4px}
.key{margin-top:10px;padding:8px 10px;border-radius:10px;border-left:3px solid var(--hot);background:#7f7f7f18;font-size:.78rem}
.x{position:absolute;right:8px;top:8px;z-index:2;width:26px;height:26px;border-radius:50%;border:0;background:#0006;color:#fff;cursor:pointer}
#md{position:absolute;inset:0;z-index:20;background:#0009;backdrop-filter:blur(6px);display:none;place-items:center;padding:16px}
#md.open{display:grid;animation:fade .3s}
.pn{width:min(960px,100%);max-height:88vh;overflow:auto;border-radius:20px;padding:18px;position:relative}
.pn h2{margin:0 0 12px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cd{border-radius:14px;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:.25s;background:var(--glass)}
.cd:hover{transform:translateY(-5px) scale(1.02);border-color:var(--acc);box-shadow:0 12px 24px #0004}
.cd .im{height:70px}.cd .ic{font-size:36px!important}.cd .bd{padding:9px 11px}.cd h3{margin:0;font-size:.85rem}.cd small{color:var(--mut)}
@media(max-width:700px){#bn{position:fixed!important;left:10px!important;right:10px;bottom:62px;top:auto!important;width:auto;max-height:55vh;transform-origin:bottom}.hint{display:none}.hud h1{font-size:.9rem}#all{top:auto;bottom:64px;display:none}}
#bn .bd{columns:2;column-gap:22px}#bn .bd h2{column-span:all}.k{break-after:avoid}.key,.imp,.tags,.fch{break-inside:avoid}@media(max-width:700px){#bn .bd{columns:1}}
:root:root{--bg:#02080a;--fg:#e6fff4;--mut:#86b3a3;--glass:#06161ce6;--line:#3dffb826;--dot:#17a870;--acc:#34f0a4;--hot:#ffb02e;--s1:#0c4a3c;--s2:#02100e;--glow:#2bf0a0;--stage:radial-gradient(ellipse at 50% 45%,#06231f,#010608 75%);color-scheme:dark}
</style></head><body>
